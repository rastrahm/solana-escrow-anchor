[toolchain]
package_manager = "npm"
# Solana CLI 2.2.x default (platform-tools v1.48) no parsea crates edition2024.
# Usar: npm run build:program  (= cargo-build-sbf --tools-version v1.52)

[features]
resolution = true
skip-lint = false

[programs.localnet]
escrow = "2nak96ykerNBL3DkTcWoUKPgiENtLBS8ij9LhyPGXrAS"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "npx ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
